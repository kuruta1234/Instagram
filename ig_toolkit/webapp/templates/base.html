<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ig-toolkit{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<header class="topnav">
  <a class="brand" href="{{ url_for('igtool.posts_list') }}">ig-toolkit</a>
  <nav>
    <a href="{{ url_for('igtool.posts_list') }}">投稿一覧</a>
    <a href="{{ url_for('igtool.post_new') }}">新規作成</a>
    <a href="{{ url_for('igtool.calendar_page') }}">カレンダー</a>
  </nav>
</header>

<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-list">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>
</body>
</html>
